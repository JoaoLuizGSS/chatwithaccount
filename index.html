<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ZapChat | Chat Virtual</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto+Mono:wght@400;700&display=swap" rel="stylesheet">

    <script src="https://www.gstatic.com/firebasejs/9.6.10/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.10/firebase-database-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.10/firebase-auth-compat.js"></script>

    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="responsivo.css">
    <link rel="shortcut icon" href="favicon.ico" type="image/x-icon">
</head>

<body>

    <section id="login-section" class="container-auth">
        <div class="card">
            <div class="auth-tabs">
                <button type="button" id="tab-login" class="active">Entrar</button>
                <button type="button" id="tab-register">Cadastrar</button>
            </div>

            <h2 id="auth-title">Entrar no ZapChat</h2>
            <br>
            <form id="login-form">
                <input type="text" id="username" placeholder="Seu nome de usuário..." required autocomplete="username">
                <input type="password" id="password" placeholder="Sua senha..." required
                    autocomplete="current-password">
                <button type="submit" id="btn-auth">Entrar</button>
            </form>
        </div>
    </section>

    <section id="chat-section" class="app-layout" style="display: none;">

        <aside class="sidebar">
            <div class="sidebar-header">
                <span>ZapChat</span>
                <button id="btn-settings-open" class="icon-btn" type="button" title="Configurações">⚙️</button>
            </div>

            <div class="chat-tabs">
                <button id="tab-groups" class="active">Grupos</button>
                <button id="tab-dms">DMs</button>
            </div>

            <div id="list-container" class="list-container"></div>
        </aside>

        <div class="chat-wrapper">
            <div class="chat-header">
                <h3 id="current-chat-title">Selecione uma conversa</h3>
            </div>
            <div id="chat-messages" class="messages-container"></div>

            <form id="chat-form" class="input-area" style="display: none;">
                <input type="text" id="chat-input" placeholder="Digite uma mensagem..." autocomplete="off" required>
                <button type="submit" id="btn-chat-submit">Enviar</button>
            </form>
        </div>

    </section>

    <div id="settings-modal" class="modal-overlay" style="display: none;">
        <div class="modal-card">
            <h3>Configurações da Conta</h3>
            <div class="modal-body">

                <div class="setting-item">
                    <label for="theme-select">Tema do Aplicativo:</label>
                    <select id="theme-select">
                        <option value="dark">Tema Escuro</option>
                        <option value="light">Tema Claro</option>
                    </select>
                </div>

                <hr class="modal-divider">

                <div class="setting-item">
                    <label>Alterar Senha:</label>
                    <input type="password" id="new-password-input" placeholder="Nova senha (mín. 6 caracteres)">
                    <button type="button" id="btn-change-password" class="danger-btn secondary">Atualizar Senha</button>
                </div>

                <hr class="modal-divider">

                <div class="setting-item">
                    <label style="color: #e74c3c;">Zona de Perigo:</label>
                    <p style="font-size: 11px; color: var(--text-secondary); margin-bottom: 8px;">A exclusão removerá
                        permanentemente seu acesso e registro do sistema.</p>
                    <button type="button" id="btn-delete-account" class="danger-btn">Excluir Minha Conta</button>
                </div>

            </div>
            <div class="modal-footer">
                <button id="btn-settings-close" type="button">Fechar</button>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>

</html>
